<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Русский язык · проверочный тест · 30 вопросов</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #17263e; background: #eef3f8; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; }
    main { max-width: 1100px; margin: auto; }
    h1 { font-size: clamp(30px, 3vw, 44px); margin: 0 0 16px; }
    h2 { font-size: clamp(24px, 2.4vw, 32px); }
    p, li { font-size: 21px; line-height: 1.45; }
    .card { background: white; border: 1px solid #cfdae7; border-radius: 18px; padding: clamp(20px, 3vw, 36px); box-shadow: 0 8px 28px #1c355013; }
    .meta { color: #3c5672; font-size: 19px; }
    .choices { display: grid; gap: 14px; margin: 24px 0; }
    button { font: inherit; font-size: 21px; min-height: 60px; border-radius: 12px; border: 2px solid #9aafc5; padding: 14px 20px; background: white; color: inherit; cursor: pointer; text-align: left; }
    button:hover { border-color: #2b5f9e; }
    button:focus-visible { outline: 4px solid #ee9e24; outline-offset: 3px; }
    button[aria-pressed="true"] { border-color: #165ea8; background: #e4f1ff; font-weight: 700; }
    button.primary { background: #165ea8; color: white; border-color: #165ea8; text-align: center; font-weight: 700; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .actions { display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; }
    .actions button { min-width: 170px; text-align: center; }
    .review { border-top: 1px solid #cad6e4; padding: 20px 0; }
    .review p { margin: 8px 0; }
    .right { color: #145a32; font-weight: 700; }
    .wrong { color: #a32a25; font-weight: 700; }
    .hidden { display: none; }
    @media (max-width: 600px) { body { padding: 12px; } .actions button { flex: 1; } }
  </style>
</head>
<body>
<main>
  <h1>Русский язык · проверочный тест</h1>
  <div class="card" id="app"></div>
</main>
<script>
const questions = [{"section":"Орфография","prompt":"В каком слове безударная гласная корня проверяется словом «мир»?","choices":["примерять пальто","преодолеть препятствие","растение у дороги","примирить друзей"],"correct":3,"explanation":"В слове примирить корень -мир- проверяется словом мир. В остальных вариантах гласная определяется чередованием, приставкой или словарным написанием."},{"section":"Орфография","prompt":"В каком слове на месте пропуска пишется приставка ПРЕ-?","choices":["пр..открыть дверь","пр..школьный участок","пр..одолеть","пр..бежать к дому"],"correct":2,"explanation":"Преодолеть означает «справиться, превозмочь»; здесь приставка близка по значению к пере-."},{"section":"Орфография","prompt":"В каком слове пишутся НН?","choices":["письмо отправлено утром","прочитанная книга","комната убрана","девочка взволнована новостью"],"correct":1,"explanation":"В полной форме страдательного причастия прочитанная пишутся НН: есть приставка про- и зависимое значение действия. В кратких страдательных причастиях пишется одна Н."},{"section":"Орфография","prompt":"В каком варианте НЕ пишется раздельно?","choices":["не законченная к сроку работа","незаконченная работа","небольшая ошибка","невысокий, но крепкий дом"],"correct":0,"explanation":"У причастия есть зависимые слова к сроку, поэтому НЕ пишется раздельно: не законченная к сроку."},{"section":"Орфография","prompt":"В каком наречии после шипящей на конце пишется Ь?","choices":["уж","замуж","невтерпёж","настежь"],"correct":3,"explanation":"В наречии настежь после шипящей пишется мягкий знак. Исключения: уж, замуж, невтерпёж."},{"section":"Орфография","prompt":"Выберите правильное написание слова.","choices":["по новому-то","по-новомуу","по-новому","по новому"],"correct":2,"explanation":"Наречие с приставкой по- и суффиксом -ому пишется через дефис."},{"section":"Пунктуация","prompt":"В каком предложении нужна запятая при однородных определениях?","choices":["Он купил новый шерстяной шарф.","Вдали показался старый деревянный дом.","На ветке висели красные, жёлтые листья.","Утром мы вышли на широкую лесную дорогу."],"correct":2,"explanation":"Красные и жёлтые — однородные определения: перечисляются цвета листьев. В остальных вариантах определения характеризуют предмет с разных сторон или образуют сочетание."},{"section":"Пунктуация","prompt":"Укажите предложение с правильно расставленными знаками при причастном обороте.","choices":["Дом построенный, у реки был виден издалека.","Дом, построенный у реки, был виден издалека.","Дом построенный у реки был виден издалека.","Дом, построенный у реки был виден издалека."],"correct":1,"explanation":"Причастный оборот стоит после определяемого слова дом, поэтому выделяется запятыми с двух сторон."},{"section":"Пунктуация","prompt":"В каком предложении деепричастный оборот выделен верно?","choices":["Закончив работу, мастер выключил свет.","Закончив, работу мастер выключил свет.","Мастер выключил, закончив работу свет.","Мастер закончив работу выключил свет."],"correct":0,"explanation":"Деепричастный оборот закончив работу обозначает добавочное действие и отделяется запятой."},{"section":"Пунктуация","prompt":"В каком предложении правильно поставлена запятая перед союзом ЧТО?","choices":["Я понял что, поезд уже ушёл.","Я, понял что поезд уже ушёл.","Я понял что поезд, уже ушёл.","Я понял, что поезд уже ушёл."],"correct":3,"explanation":"Придаточная изъяснительная часть присоединяется союзом что; перед союзом ставится запятая."},{"section":"Пунктуация","prompt":"В каком предложении правильно оформлена вводная конструкция?","choices":["К, счастью дождь быстро закончился.","К счастью дождь быстро, закончился.","К счастью, дождь быстро закончился.","К счастью дождь, быстро закончился."],"correct":2,"explanation":"Сочетание к счастью выражает оценку говорящего и является вводным; оно отделяется запятой."},{"section":"Пунктуация","prompt":"Укажите бессоюзное сложное предложение, в котором нужно поставить двоеточие.","choices":["Ветер стих, тучи разошлись.","Я оглянулся: за мной никого не было.","Солнце село, и стало прохладно.","Когда стемнело, мы вернулись."],"correct":1,"explanation":"Вторая часть поясняет, что именно увидел говорящий; между частями бессоюзного сложного предложения ставится двоеточие."},{"section":"Грамматика и синтаксис","prompt":"Укажите грамматическую основу предложения «Вечером похолодало».","choices":["вечером было холодно","похолодало","вечером похолодало","вечером"],"correct":1,"explanation":"Это односоставное безличное предложение. Его главный член выражен безличным глаголом похолодало."},{"section":"Грамматика и синтаксис","prompt":"Какое предложение является сложноподчинённым?","choices":["Мы задержались, потому что начался дождь.","Мы задержались, и начался дождь.","Начался дождь — мы задержались.","Начался дождь, задержавший поезд."],"correct":0,"explanation":"В предложении есть главная и придаточная части, соединённые подчинительным союзом потому что."},{"section":"Грамматика и синтаксис","prompt":"Определите тип предложения: «Ветер стих, и море успокоилось».","choices":["сложноподчинённое","бессоюзное сложное","простое с однородными сказуемыми","сложносочинённое"],"correct":3,"explanation":"Две грамматические основы соединены сочинительным союзом и: ветер стих; море успокоилось."},{"section":"Грамматика и синтаксис","prompt":"В каком предложении допущена ошибка в построении с деепричастным оборотом?","choices":["Подъехав к станции, пассажиры вышли из вагона.","Я шёл по улице, насвистывая мелодию.","Подъезжая к станции, у меня слетела шляпа.","Подъезжая к станции, я увидел знакомый дом."],"correct":2,"explanation":"В ошибочном предложении действие подъезжая не может относиться к подлежащему шляпа. У основного и добавочного действий должен быть общий исполнитель."},{"section":"Грамматика и синтаксис","prompt":"Выберите предложение с правильным согласованием подлежащего и сказуемого.","choices":["Каждая из участников пришёл заранее.","Каждый из участников пришёл заранее.","Каждый из участников пришли заранее.","Каждый из участника пришёл заранее."],"correct":1,"explanation":"Местоимение каждый — подлежащее мужского рода в единственном числе, поэтому сказуемое имеет форму пришёл."},{"section":"Грамматика и синтаксис","prompt":"Какое слово является дополнением в предложении «Учитель объяснил правило ученикам»?","choices":["правило","учитель","объяснил","ученикам"],"correct":0,"explanation":"Правило — прямое дополнение: объяснил что? правило. Учитель — подлежащее, объяснил — сказуемое, ученикам — косвенное дополнение."},{"section":"Лексика и фразеология","prompt":"Какой фразеологизм близок по значению слову «близко»?","choices":["рукой подать","махать руками","золотые руки","рука помощи"],"correct":0,"explanation":"Рукой подать означает «совсем близко». Остальные варианты имеют другие значения."},{"section":"Лексика и фразеология","prompt":"В каком предложении слово употреблено в переносном значении?","choices":["Девочка улыбнулась маме.","На стене висели часы.","Мы встретились утром.","Утро улыбнулось городу."],"correct":3,"explanation":"Утро не может улыбаться буквально; действие человека перенесено на явление природы."},{"section":"Лексика и фразеология","prompt":"Укажите синоним к слову «смелый».","choices":["осторожный","равнодушный","отважный","робкий"],"correct":2,"explanation":"Отважный близко по значению к слову смелый."},{"section":"Лексика и фразеология","prompt":"Укажите антоним к слову «рассеянный» в значении «невнимательный».","choices":["мечтательный","сосредоточенный","задумчивый","забывчивый"],"correct":1,"explanation":"Сосредоточенный — противоположное по смыслу слово к рассеянный в значении «невнимательный»."},{"section":"Лексика и фразеология","prompt":"В каком сочетании слово «корень» употреблено в переносном значении?","choices":["корень проблемы","корень дерева","корень растения","корень зуба"],"correct":0,"explanation":"В сочетании корень проблемы слово означает источник, основу проблемы; это переносное значение."},{"section":"Лексика и фразеология","prompt":"Что означает фразеологизм «держать язык за зубами»?","choices":["говорить громко","быстро учить слова","спорить с собеседником","молчать, не разглашать"],"correct":3,"explanation":"Фразеологизм означает хранить молчание, не выдавать секрет."},{"section":"Средства выразительности","prompt":"Какое средство выразительности использовано в предложении «Лес задумался»?","choices":["гипербола","метонимия","антитеза","олицетворение"],"correct":3,"explanation":"Лесу приписано свойство человека — задумываться; это олицетворение."},{"section":"Средства выразительности","prompt":"Укажите метафору.","choices":["прохладная осенняя погода","листья упали на землю","золотая осень","осень наступила в октябре"],"correct":2,"explanation":"Слово золотая образно переносит признак драгоценного металла на цвет осенней листвы."},{"section":"Средства выразительности","prompt":"В каком примере использовано сравнение?","choices":["Река проснулась на рассвете.","Река блестела, будто серебряная лента.","Река блестела на солнце.","Серебряная река текла между берегами."],"correct":1,"explanation":"Союз будто прямо сопоставляет реку с серебряной лентой; это сравнение."},{"section":"Средства выразительности","prompt":"Какое средство выразительности основано на чрезмерном преувеличении?","choices":["гипербола","литота","эпитет","метонимия"],"correct":0,"explanation":"Гипербола — намеренное преувеличение признака, размера или силы явления."},{"section":"Средства выразительности","prompt":"Как называется образное определение в сочетании «серебряный голос»?","choices":["сравнение","градация","перифраз","эпитет"],"correct":3,"explanation":"Слово серебряный образно характеризует голос; это эпитет."},{"section":"Средства выразительности","prompt":"В каком предложении использована антитеза?","choices":["Необходимость возникла внезапно.","Роскошь была необходимой.","Не роскошь, а необходимость.","Роскошь и необходимость обсуждали долго."],"correct":2,"explanation":"Антитеза противопоставляет понятия роскошь и необходимость."}];
const answers = Array(questions.length).fill(null);
let current = 0;
let finished = false;
const app = document.getElementById('app');
function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}
function render() {
  app.replaceChildren();
  if (finished) return renderResult();
  const question = questions[current];
  app.append(element('p', 'Задание ' + (current + 1) + ' из 30 · ' + question.section, 'meta'));
  app.append(element('h2', question.prompt));
  const choices = element('div', undefined, 'choices');
  question.choices.forEach((choice, index) => {
    const button = element('button', String.fromCharCode(65 + index) + '. ' + choice);
    button.type = 'button';
    button.setAttribute('aria-pressed', String(answers[current] === index));
    button.onclick = () => { answers[current] = index; render(); };
    choices.append(button);
  });
  app.append(choices);
  const actions = element('div', undefined, 'actions');
  if (current > 0) {
    const back = element('button', 'Назад');
    back.onclick = () => { current--; render(); };
    actions.append(back);
  }
  const next = element('button', current === 29 ? 'Завершить тест' : 'Дальше', 'primary');
  next.disabled = answers[current] === null;
  next.onclick = () => {
    if (current === 29) { finished = true; render(); }
    else { current++; render(); }
    window.scrollTo(0, 0);
  };
  actions.append(next);
  app.append(actions);
}
function renderResult() {
  const score = answers.reduce((sum, answer, index) => sum + Number(answer === questions[index].correct), 0);
  app.append(element('h2', 'Результат: ' + score + ' из 30'));
  app.append(element('p', 'Правильные ответы и объяснения по всем заданиям:'));
  questions.forEach((question, index) => {
    const block = element('section', undefined, 'review');
    block.append(element('p', (index + 1) + '. ' + question.prompt));
    const correct = answers[index] === question.correct;
    block.append(element('p', correct ? 'Верно' : 'Неверно. Ваш ответ: ' + question.choices[answers[index]], correct ? 'right' : 'wrong'));
    block.append(element('p', 'Правильный ответ: ' + question.choices[question.correct]));
    block.append(element('p', question.explanation));
    app.append(block);
  });
  const restart = element('button', 'Пройти ещё раз', 'primary');
  restart.onclick = () => { answers.fill(null); current = 0; finished = false; render(); window.scrollTo(0, 0); };
  app.append(restart);
}
render();
</script>
</body>
</html>
